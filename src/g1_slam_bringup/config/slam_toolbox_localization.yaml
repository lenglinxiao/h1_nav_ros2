slam_toolbox:
  ros__parameters:
    use_sim_time: false
    mode: localization
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    transform_publish_period: 0.02
    map_update_interval: 2.0
    resolution: 0.05
    max_laser_range: 25.0
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    minimum_time_interval: 0.5
    throttle_scans: 1
