pointcloud_to_laserscan:
  ros__parameters:
    target_frame: body
    transform_tolerance: 0.2
    min_height: -0.90
    max_height: 0.80
    angle_min: -3.14159
    angle_max: 3.14159
    angle_increment: 0.0087
    scan_time: 0.1
    range_min: 0.2
    range_max: 30.0
    use_inf: true
    inf_epsilon: 1.0
    stamp_with_current_time: true
    stale_stamp_warn_sec: 1.0
